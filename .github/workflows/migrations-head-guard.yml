# Always-on Alembic chain guard (CITY-639). Replaces the path-filtered
# migrations.yml.
#
# No path filter on purpose: this is meant to be a REQUIRED status check, and
# GitHub never reports a path-filtered check on PRs that don't match the filter,
# which leaves those PRs waiting forever on a required check. It only reads the
# revision files (`alembic heads` + a static duplicate-ID scan, no database), so
# running it on every PR is cheap.
#
# With "require branches to be up to date before merging" on main, two PRs that
# each add a migration off the same parent can't both merge: once the first
# lands, the second must update onto main, its branch now carries both heads,
# and this check fails until `bin/migrations fix-heads` reconciles them.
# The push-to-main run is a backstop detector.
name: Migrations Head Guard

on:
  pull_request:
    branches: [main]
    # The defaults plus `edited`: retargeting a PR's base to main fires only
    # `edited`, and the required check must report for that PR too.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  # PR runs share a group per PR and supersede each other; push runs are
  # grouped by commit SHA so every commit on main gets its own result (a
  # shared group would cancel or replace runs when merges land close together).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  guard:
    permissions:
      contents: read
    # This job name is the status-check context to mark as required on main.
    # Renaming it without updating branch protection silently stops gating PRs.
    name: Assert single Alembic head
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Alembic deps
        # Revision files import alembic, sqlalchemy and city_api.database (which
        # imports sqlalchemy.ext.asyncio, hence the asyncio extra for greenlet).
        # Majors pinned: an unpinned upgrade would turn this required check red on
        # every PR at once (SQLAlchemy 2.1 already stopped pulling in greenlet).
        run: pip install "alembic>=1.13,<2" "sqlalchemy[asyncio]>=2.0,<2.2" "python-dotenv>=1,<2"

      - name: Check Alembic chain
        env:
          ALEMBIC_CMD: alembic
        run: |
          # Exit 1 = chain problem (what this guard is for); exit 2 = alembic
          # broken on the runner (an environment fault, not a chain problem).
          status=0
          ./bin/migrations check || status=$?
          if [[ "$status" -eq 1 ]]; then
            echo "::error::Alembic chain has multiple heads, a duplicate revision ID, or a dangling down_revision (see log above). For multiple heads: update this branch onto the latest main, run 'bin/migrations fix-heads', commit the merge migration, and push."
            exit 1
          elif [[ "$status" -ne 0 ]]; then
            echo "::error::bin/migrations check failed (exit $status); could not verify the Alembic chain (see log above)."
            exit "$status"
          fi

  upgrade-empty-db:
    permissions:
      contents: read
    # Builds a database from nothing with the real migration chain, the way a
    # new environment (or e2e.yml) does. Catches migrations that only work on
    # databases that already ran them (CITY-684: duplicate CREATE TYPE).
    name: Alembic upgrade on empty Postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: city_doodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install API requirements
        # The same requirements the Fly image installs for its release_command.
        run: pip install -r requirements.txt

      - name: alembic upgrade head
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@localhost:5432/city_doodle
        run: |
          alembic upgrade head
          alembic current

      # Round trip (CITY-685): every downgrade must run, and the chain must
      # rebuild from base. Downgrades had never been exercised; 018's dropped
      # an index that 002's downgrade then failed to drop.
      - name: alembic downgrade base, then upgrade head again
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@localhost:5432/city_doodle
          PGPASSWORD: postgres
        run: |
          alembic downgrade base
          # Base must leave nothing behind but alembic_version: a leftover
          # table or enum type would hide in a re-upgrade that uses IF NOT EXISTS.
          leftovers=$(psql -h localhost -U postgres -d city_doodle -Atc "
            SELECT 'table ' || tablename FROM pg_tables
              WHERE schemaname = 'public' AND tablename <> 'alembic_version'
            UNION ALL
            SELECT 'type ' || t.typname FROM pg_type t
              JOIN pg_namespace n ON n.oid = t.typnamespace
              WHERE n.nspname = 'public' AND t.typtype = 'e'")
          if [ -n "$leftovers" ]; then
            echo "::error::alembic downgrade base left objects behind:"
            echo "$leftovers"
            exit 1
          fi
          alembic upgrade head
          alembic current
