# Run Python linting with ruff on PRs and pushes to main
name: Lint

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/lint.yml'

concurrency:
  # PR runs share a group per PR and supersede each other; push runs are
  # grouped by commit SHA so every commit on main gets its own result (a
  # shared group would cancel or replace runs when merges land close together).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # Same ruff pin as pyproject.toml's dev extra (tests/vibe/test_lint_config.py).
      - name: Install linting tools
        run: pip install "ruff==0.17.3" mypy

      - name: Run ruff check
        run: ruff check lib/ bin/ --output-format=github

      - name: Run ruff format check
        run: ruff format lib/ bin/ --check --diff

      - name: Run mypy type checking
        run: mypy lib/vibe/
