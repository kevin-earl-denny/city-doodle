# Playwright end-to-end tests (non-required; CITY-676).
#
# Split out of tests.yml by CITY-652, where `npx playwright test || true` ran
# with no database or API and always failed silently. This job brings up
# Postgres, migrates it, and lets playwright.config.ts start the API and web
# dev servers. It runs on demand and weekly until it's proven reliable; then
# CITY-676 adds pull_request and makes it blocking.
name: E2E

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 10:00 UTC
    - cron: '0 10 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    permissions:
      contents: read
    name: Playwright (chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: city_doodle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/city_doodle_test
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/city_doodle_test
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install API
        run: pip install -e "apps/api[dev]"

      - name: Migrate database
        working-directory: apps/api
        run: alembic upgrade head

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: npm

      - name: Install web
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
