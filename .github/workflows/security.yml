# Security checks: secret scanning, dependency review, SBOM, CodeQL.
#
# Gitleaks runs as the OSS CLI (checksum-verified) rather than
# gitleaks/gitleaks-action, which needs a paid license on organization-owned
# repos. PRs scan only the commits they add; pushes to main and the weekly
# schedule scan full history.
name: Security

on:
  pull_request:
    # Any base, so stacked ticket PRs are scanned too.
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 09:00 UTC
    - cron: '0 9 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict -
          sudo tar -xzf "$tarball" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            gitleaks git --config .gitleaks.toml --redact --verbose --log-opts="$BASE_SHA..$HEAD_SHA" .
          else
            gitleaks git --config .gitleaks.toml --redact --verbose .
          fi

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Probe the endpoint dependency-review-action itself calls rather than
      # reading `security_and_analysis`, which the workflow token can't see.
      # Only the documented 403 ("not available for this repo") skips the
      # review, loudly; any other failure fails the job.
      - name: Check Dependency Review availability
        id: depgraph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=$(curl -s -o "$RUNNER_TEMP/resp.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA")
          msg=$(jq -r '.message // ""' "$RUNNER_TEMP/resp.json" 2>/dev/null || true)
          if [ "$code" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "403" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency Review unavailable for this repo (HTTP 403: $msg). Enable the Dependency graph to turn it on."
          else
            echo "::error::Dependency graph probe failed ($code): $msg"
            exit 1
          fi

      - name: Dependency Review
        if: steps.depgraph.outputs.available == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  sbom:
    name: Generate SBOM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate SBOM
        run: syft . -o spdx-json > sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: python
          # Python is interpreted; skip autobuild to avoid "No source code seen" failures
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
