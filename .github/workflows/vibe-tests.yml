# Run the repo-tooling pytest suite (tests/, including tests/vibe) on every PR
# and on main, and fail when it fails.
#
# Guards that live in tests (tests/vibe/test_workflow_pins.py: SHA pins,
# permissions, timeouts) only protect anything if CI runs them, and tests.yml
# currently swallows failures. No services needed, so this stays a fast check.
name: Vibe tests

on:
  pull_request:
    # Any base, so stacked ticket PRs get checked too.
  push:
    branches: [main]

concurrency:
  # PR runs share a group per PR and supersede each other; push runs are
  # grouped by commit SHA so every commit on main gets its own result (a
  # shared group would cancel or replace runs when merges land close together).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    permissions:
      contents: read
    name: Vibe tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install (dev + batch + fly extras)
        run: pip install -e ".[dev,batch,fly]"

      - name: pytest tests
        run: pytest tests -q -p no:cacheprovider
