# Run the repo-tooling pytest suite (tests/, including tests/vibe) on every PR
# and on main, and fail when it fails.
#
# Guards that live in tests (tests/vibe/test_workflow_pins.py: SHA pins,
# permissions, timeouts) only protect anything if CI runs them, and tests.yml
# currently swallows failures. No services needed, so this stays a fast check.
name: Vibe tests

on:
  pull_request:
    # Any base, so stacked ticket PRs get checked too.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    permissions:
      contents: read
    name: Vibe tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install (dev + batch + fly extras)
        run: pip install -e ".[dev,batch,fly]"

      - name: pytest tests
        run: pytest tests -q -p no:cacheprovider
