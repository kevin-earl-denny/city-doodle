# Run every test suite and FAIL when tests fail (CITY-652).
#
# Previously every step ended in `|| true` and the dev install silently fell
# back to bare pytest, so this check was green no matter what.
#
# The repo-tooling suite (tests/) runs in vibe-tests.yml. App suites run here
# as parallel jobs. "Run Tests" is an aggregate job that fails
# unless every suite succeeded; it is the one context to mark required, so
# adding or renaming a suite job never touches branch protection.
#
# Playwright e2e needs Postgres + API + web servers and isn't reliable in CI
# yet; it lives in e2e.yml as a non-required job.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    # Any base, so stacked ticket PRs get tested too.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede stale PR runs only; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  api:
    permissions:
      contents: read
    name: API tests (apps/api)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # In-memory SQLite (tests/conftest.py default). The Postgres path is
      # broken and tracked in CITY-673.
      - name: pytest
        run: pytest -q -p no:cacheprovider

  worker:
    permissions:
      contents: read
    name: Worker tests (apps/worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -q -p no:cacheprovider

  web:
    permissions:
      contents: read
    name: Web tests (apps/web vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: vitest
        run: npm run test --workspace=apps/web

  run-tests:
    permissions:
      contents: read
    # The required status check. Fails unless every suite job succeeded
    # (a skipped or cancelled suite counts as a failure).
    name: Run Tests
    if: always()
    needs: [api, worker, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check suite results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Test suites did not succeed: $failed"
            exit 1
          fi
