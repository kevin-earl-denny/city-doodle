# Run every test suite and FAIL when tests fail (CITY-652).
#
# Previously every step ended in `|| true` and the dev install silently fell
# back to bare pytest, so this check was green no matter what.
#
# The repo-tooling suite (tests/) runs in vibe-tests.yml. App suites run here
# as parallel jobs, and "Run Tests" is an aggregate job that fails unless every
# suite succeeded. Branch protection (CITY-638) must require BOTH "Run Tests"
# and "Vibe tests"; requiring the aggregate (not each suite job) means adding
# or renaming a suite job never touches branch protection.
#
# Playwright e2e needs Postgres + API + web servers and isn't reliable in CI
# yet; it lives in e2e.yml as a non-required job.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    # Any base, so stacked ticket PRs get tested too.

permissions:
  contents: read

concurrency:
  # PR runs share a group per PR and supersede each other; push runs are
  # grouped by commit SHA so every commit on main gets its own result (a
  # shared group would cancel or replace runs when merges land close together).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  api:
    # Both backends: SQLite is the local default (fast, no setup); Postgres is
    # what production runs and the only one that enforces FKs/cascades and
    # native ENUM types.
    permissions:
      contents: read
    name: API tests (apps/api, ${{ matrix.db }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: city_doodle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: pytest
        env:
          DB: ${{ matrix.db }}
        run: |
          # Leave TEST_DATABASE_URL unset for SQLite (tests/conftest.py default).
          if [ "$DB" = "postgres" ]; then
            export TEST_DATABASE_URL="postgresql+asyncpg://postgres:postgres@localhost:5432/city_doodle_test"
          fi
          pytest -q -p no:cacheprovider

  worker:
    permissions:
      contents: read
    name: Worker tests (apps/worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -q -p no:cacheprovider

  web:
    permissions:
      contents: read
    name: Web tests (apps/web vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: vitest
        run: npm run test --workspace=apps/web

  run-tests:
    permissions:
      contents: read
    # The required status check. Fails unless every suite job succeeded
    # (a skipped or cancelled suite counts as a failure).
    name: Run Tests
    if: always()
    needs: [api, worker, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check suite results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Test suites did not succeed: $failed"
            exit 1
          fi
