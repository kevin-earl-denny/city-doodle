# Fly.io configuration for City Doodle API
# See https://fly.io/docs/reference/configuration/ for all options

app = "city-doodle-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "alembic upgrade head"

[env]
  PORT = "8080"
  LOG_LEVEL = "info"
  # APP_ENV picks the Axiom dataset (CITY-642): only "production" writes to
  # AXIOM_DATASET (default city-doodle). Logs ship only when the AXIOM_API_TOKEN
  # secret is set: fly secrets set AXIOM_API_TOKEN=xaat-... -a city-doodle-api
  # Optional secrets/env: AXIOM_DATASET, AXIOM_ORG_ID (personal tokens only).
  APP_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
